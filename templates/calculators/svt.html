<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>svt</title>
  </head>
  <body>
    <h1>svt</h1>

    <div class="form-container">
      <div class="form-item">
        <label for="distance">Расстояние:</label>
        <input
          type="number"
          id="distance"
          placeholder="Например: 70"
          step="0.1"
        />
        <div class="error-message" id="distance-error">
          Введите расстояние от 1 до 300 
        </div>
      </div>

      <div class="form-item">
        <label for="velocity">speed:</label>
        <input type="number" id="velocity" placeholder="Например: 10" />
        <div class="error-message" id="velocity-error">
          Введите скорость от 1 до 100 
        </div>
      </div>

      <div class="form-item">
        <label for="time">time:</label>
        <input type="number" id="time" placeholder="Например: 1" />
        <div class="error-message" id="time-error">
          Введите время от 1 до 100 
        </div>
      </div>
      <button id="calculate">Рассчитать</button>

      <div id="result"></div>
    </div>
  </body>
</html>
